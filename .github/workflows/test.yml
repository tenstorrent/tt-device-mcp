name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - uses: pre-commit/action@v3.0.1
  check-spdx-licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check SPDX licenses
        uses: tenstorrent/tt-github-actions/.github/actions/spdx-checker@main
        with:
          ignore_config_file: ".github/spdx_ignore.yaml"
          verbose: "true"
  test:
    runs-on: ubuntu-latest
    # A hang must not hold the runner for GitHub's 6 h default.
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.10"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      # A venv, because that is how the broker is deployed: one venv owns the package and
      # everything it drags in, isolated from the system interpreter.
      - name: Install package and dev dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"
      - name: Run pytest
        run: .venv/bin/pytest -v
