#
# systemd's default SystemMaxUse is 10% of the filesystem capped at 4G, which on these
# hosts held only ~6 days of journal — too short to correlate a device drop against the
# kernel's AER/PCIe log after the fact, which is exactly when the correlation is needed.
# 32G of a ~900G disk buys ~30 days and is a non-issue; MaxRetentionSec bounds the age so
# a quiet host does not hoard beyond the window the size cap would otherwise permit.
[Journal]
SystemMaxUse=32G
MaxRetentionSec=1month
